[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morsecode"
dynamic = ["version"]
description = "Python project template for Claude Code development"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pyqtgraph>=0.13.0",
    "PyQt5>=5.15.0",
    "pyyaml>=6.0",
    "toml>=0.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",  # ASCII graphics and layouts for SSH debugging
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
    "black>=23.0",
]

[project.scripts]
morsecode = "morsecode.cli.main:main"
morsecode-test-gen = "tests.fixtures.test_generator:main"
morsecode-test-data = "tests.fixtures.test_data_generator:main"

[project.urls]
Homepage = "https://github.com/yourusername/morsecode"
Repository = "https://github.com/yourusername/morsecode.git"
Issues = "https://github.com/yourusername/morsecode/issues"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests", "src/util/config/tests", "src/util/logging/tests", "src/util/graph/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
    "--ignore=tests/development/",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.pytest-cov]
branch = true
source = ["src"]
omit = [
    "tests/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "D",    # pydocstyle
]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D203",  # 1 blank line required before class docstring
    "D213",  # Multi-line docstring summary should start at the second line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # Don't require docstrings in tests
"__init__.py" = ["D104"]
# Exclude examples and demo files from quality checks
"**/examples/*" = ["E", "W", "F", "B", "C4", "D", "UP", "I"]
"**/demo*.py" = ["E", "W", "F", "B", "C4", "D", "UP", "I"]
"**/test_*.py" = ["E402", "F841", "D107"]  # Allow common test patterns
"test_*.py" = ["E402", "F841", "D107", "E501", "F821"]  # Allow test file patterns
# Exclude specific analysis and development files
"analyze_*.py" = ["E", "W", "F", "B", "C4", "D", "UP", "I"]
"create_*.py" = ["E", "W", "F", "B", "C4", "D", "UP", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
mypy_path = "src"
# Focus on production code quality - exclude tests and examples
exclude = [
    "tests/",
    "test_.*\\.py",
    ".*_test\\.py",
    "debug_.*\\.py",
    "serialization_demo\\.py",
    "analyze_.*\\.py",
    "create_.*\\.py",
    "tests/test_interface_based_.*\\.py",
    "src/util/",
    ".*/examples/.*",
    ".*/demo.*\\.py"
]

# Production code should be type-safe
strict = false  # Start more lenient, can tighten later
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# Core type safety for production
disallow_untyped_defs = false  # Too strict for current codebase - CI fix
check_untyped_defs = true
no_implicit_optional = true

# Allow some flexibility for complex generic types
disallow_any_generics = false

[tool.black]
line-length = 120
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/tests/*",
    "*/test_*.py",
    "*/examples/*",
    "*/demo*.py",
    "test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "tests/htmlcov"
